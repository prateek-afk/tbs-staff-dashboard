<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Black Steel — Staff Performance</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
  :root {
    --bg-page: #F4F2EE;
    --bg-card: #FFFFFF;
    --bg-card-muted: #F1EFE8;
    --border: #E2DFD6;
    --text-primary: #21201C;
    --text-secondary: #6B6962;
    --text-tertiary: #9C9A91;
    --accent: #185FA5;
    --accent-bg: #E6F1FB;
    --danger: #A32D2D;
    --danger-bg: #FCEBEB;
    --good: #3B6D11;
    --good-bg: #EAF3DE;
    --radius-md: 8px;
    --radius-lg: 12px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Roboto Mono", Consolas, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-page);
    color: var(--text-primary);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
  header { margin-bottom: 1.25rem; }
  header .eyebrow {
    font-size: 12px; color: var(--text-tertiary); text-transform: uppercase;
    letter-spacing: 0.04em; margin: 0 0 2px;
  }
  header h1 { font-size: 19px; font-weight: 500; margin: 0; }
  select {
    width: 100%; font-size: 16px; font-weight: 500; padding: 10px 12px;
    border-radius: var(--radius-md); border: 1px solid var(--border);
    background: var(--bg-card); color: var(--text-primary); margin-bottom: 10px;
    -webkit-appearance: none; appearance: none;
  }
  select.month-select { font-size: 14px; font-weight: 400; padding: 8px 10px; margin-bottom: 12px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 1.25rem; }
  .tabs button {
    flex: 1; font-size: 13px; padding: 9px 4px; border-radius: var(--radius-md);
    border: 1px solid var(--border); background: var(--bg-card); color: var(--text-secondary);
  }
  .tabs button.active { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); font-weight: 500; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card {
    background: var(--bg-card-muted); border-radius: var(--radius-md); padding: 14px;
  }
  .card .label { font-size: 12.5px; color: var(--text-secondary); margin: 0 0 4px; }
  .card .value { font-size: 22px; font-weight: 500; margin: 0; font-family: var(--font-mono); }
  .card .sub { font-size: 11.5px; color: var(--text-tertiary); margin: 4px 0 0; }
  .note {
    font-size: 12.5px; color: var(--text-tertiary); margin: 10px 0 0;
    display: flex; align-items: center; gap: 6px;
  }
  h3 { font-size: 15px; font-weight: 500; margin: 1.75rem 0 0.75rem; }
  h3:first-child { margin-top: 0; }
  .barrow { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .barrow .name { font-size: 13px; width: 78px; flex-shrink: 0; }
  .barrow .track {
    flex: 1; background: var(--bg-card-muted); border-radius: 6px; height: 16px;
    overflow: hidden; position: relative;
  }
  .barrow .fill { background: var(--accent); height: 100%; border-radius: 6px; }
  .barrow .fill.danger { background: var(--danger); }
  .barrow .val { font-size: 12.5px; font-family: var(--font-mono); width: 58px; text-align: right; flex-shrink: 0; }
  footer { margin-top: 2rem; font-size: 11.5px; color: var(--text-tertiary); text-align: center; }
  .incentive-box { background: var(--bg-card-muted); border-radius: var(--radius-md); padding: 14px; margin-bottom: 12px; }
  .incentive-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .incentive-label { font-size: 13px; color: var(--text-secondary); }
  .incentive-pct { font-size: 13px; font-weight: 500; font-family: var(--font-mono); }
  .incentive-amount { font-size: 20px; font-weight: 500; font-family: var(--font-mono); }
  .incentive-of { font-size: 12px; color: var(--text-tertiary); font-weight: 400; }
  .danger-text { color: var(--danger) !important; }
  .track { background: var(--bg-card); border-radius: 6px; height: 16px; overflow: hidden; position: relative; }
  .track .fill { background: var(--accent); height: 100%; border-radius: 6px; }
  .track .fill.danger { background: var(--danger); }
  .total-box {
    background: var(--accent-bg); border-radius: var(--radius-md); padding: 14px;
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;
  }
  .total-box .label { font-size: 13px; color: var(--accent); font-weight: 500; }
  .total-box .amount { font-size: 26px; font-weight: 600; font-family: var(--font-mono); color: var(--accent); }
  .month-compare-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .month-compare-row .mlabel { font-size: 13px; width: 56px; flex-shrink: 0; color: var(--text-secondary); }
</style>
</head>

function fmtMin(m) {
  if (m === null || m === undefined) return '\u2013';
  const sign = m < 0 ? '-' : '';
  const abs = Math.abs(m);
  const h = Math.floor(abs / 60), r = Math.round(abs % 60);
  return sign + (h > 0 ? h + 'h ' + r + 'm' : r + 'm');
}

function rankLabel(arr, key, name, higherIsBetter) {
  const valid = arr.filter(d => d[key] !== null && d[key] !== undefined);
  const sorted = [...valid].sort((a, b) => higherIsBetter ? b[key] - a[key] : a[key] - b[key]);
  const idx = sorted.findIndex(d => d.name === name);
  if (idx === -1) return null;
  return (idx + 1) + ' of ' + sorted.length;
}

function getHistory(name) {
  return monthKeys.map(k => {
    const d = monthlyData[k].find(x => x.name === name);
    if (!d || d.is_training) return { month: k, total: null };
    const pts = d.points !== null && d.points !== undefined ? d.points : 0;
    const ded = d.deduction_amount || 0;
    const otPay = d.ot_pay || 0;
    const grandTotal = Math.round((pts + d.total_incentive + otPay - ded) * 100) / 100;
    return { month: k, total: grandTotal };
  }).filter(h => h.total !== null);
}

function earningsBreakdown(name) {
  return monthKeys.map(k => {
    const d = monthlyData[k].find(x => x.name === name);
    if (!d || d.is_training || d.total_incentive === null || d.total_incentive === undefined) return null;
    return {
      month: k,
      attendance: d.attendance_incentive || 0,
      behaviour: d.behaviour_incentive || 0,
      ot: d.ot_pay || 0
    };
  }).filter(Boolean);
}

function roundedBarPath(x, y, w, h, r, roundTop) {
  r = Math.max(0, Math.min(r, w / 2, h));
  if (h <= 0) return '';
  if (roundTop) {
    return 'M' + x + ',' + (y + h) + ' L' + x + ',' + (y + r) +
      ' Q' + x + ',' + y + ' ' + (x + r) + ',' + y +
      ' L' + (x + w - r) + ',' + y + ' Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) +
      ' L' + (x + w) + ',' + (y + h) + ' Z';
  }
  return 'M' + x + ',' + y + ' L' + x + ',' + (y + h - r) +
    ' Q' + x + ',' + (y + h) + ' ' + (x + r) + ',' + (y + h) +
    ' L' + (x + w - r) + ',' + (y + h) + ' Q' + (x + w) + ',' + (y + h) + ' ' + (x + w) + ',' + (y + h - r) +
    ' L' + (x + w) + ',' + y + ' Z';
}

function renderEarningsChart(history) {
  const SERIES = [
    { key: 'attendance', label: 'Attendance', color: '#185FA5' },
    { key: 'behaviour', label: 'Behaviour', color: '#B9860C' },
    { key: 'ot', label: 'OT', color: '#0E8A6A' }
  ];
  const W = 440, barW = 12, barGap = 4, topPad = 26, chartH = 100, bottomPad = 22;
  const n = history.length;
  const groupW = W / n;

  const allVals = history.reduce((acc, h) => acc.concat(SERIES.map(s => h[s.key])), []);
  const dataMax = Math.max(0, ...allVals);
  const dataMin = Math.min(0, ...allVals);
  const span = (dataMax - dataMin) || 1;
  const maxVal = dataMax + span * 0.26;
  const minVal = dataMin - (dataMin < 0 ? span * 0.26 : 0);
  const range = (maxVal - minVal) || 1;
  const yFor = v => topPad + chartH * ((maxVal - v) / range);
  const zeroY = yFor(0);

  const valueLabel = v => {
    const r = Math.round(v);
    return (r < 0 ? '&minus;' : '') + '₹' + Math.abs(r).toLocaleString();
  };

  let bars = '';
  let labels = '';
  history.forEach((h, i) => {
    const gx = i * groupW;
    const totalBarsW = SERIES.length * barW + (SERIES.length - 1) * barGap;
    const startX = gx + (groupW - totalBarsW) / 2;
    SERIES.forEach((s, si) => {
      const v = h[s.key];
      const x = startX + si * (barW + barGap);
      const cx = (x + barW / 2).toFixed(1);
      const y1 = yFor(v);
      const top = Math.min(zeroY, y1);
      const barH = Math.max(1.5, Math.abs(y1 - zeroY));
      const path = roundedBarPath(x, top, barW, barH, 3, v >= 0);
      bars += '<path d="' + path + '" fill="' + s.color + '"><title>' + s.label + ' — ' +
        (monthLabels[h.month] || h.month) + ': ' + (v < 0 ? '−' : '') + '₹' + Math.abs(Math.round(v)).toLocaleString() +
        '</title></path>';
      if (v >= 0) {
        const ly = (top - 3).toFixed(1);
        bars += '<text x="' + cx + '" y="' + ly + '" transform="rotate(-90 ' + cx + ' ' + ly + ')" text-anchor="start" font-size="9" font-family="var(--font-mono)" fill="var(--text-secondary)">' + valueLabel(v) + '</text>';
      } else {
        const ly = (top + barH + 3).toFixed(1);
        bars += '<text x="' + cx + '" y="' + ly + '" transform="rotate(90 ' + cx + ' ' + ly + ')" text-anchor="start" font-size="9" font-family="var(--font-mono)" fill="var(--text-secondary)">' + valueLabel(v) + '</text>';
      }
    });
    const shortLabel = (monthLabels[h.month] || h.month).replace(' 2026', '').replace('2026', '');
    labels += '<text x="' + (gx + groupW / 2).toFixed(1) + '" y="' + (topPad + chartH + 15) +
      '" font-size="10.5" fill="var(--text-tertiary)" text-anchor="middle" font-family="var(--font-sans)">' + shortLabel + '</text>';
  });

  const svg = '<svg viewBox="0 0 ' + W + ' ' + (topPad + chartH + bottomPad) + '" style="width:100%; height:auto; display:block; overflow:visible;">' +
    '<line x1="0" y1="' + zeroY.toFixed(1) + '" x2="' + W + '" y2="' + zeroY.toFixed(1) + '" stroke="var(--border)" stroke-width="1"/>' +
    bars + labels + '</svg>';

  const legend = '<div style="display:flex; gap:14px; justify-content:center; margin-top:6px; font-size:11.5px; color:var(--text-secondary);">' +
    SERIES.map(s => '<span><span style="display:inline-block; width:8px; height:8px; border-radius:2px; background:' + s.color + '; margin-right:4px; vertical-align:-1px;"></span>' + s.label + '</span>').join('') +
    '</div>';

  return '<div style="background: var(--bg-card-muted); border-radius: var(--radius-md); padding: 14px 10px 10px;">' + svg + legend + '</div>';
}

    container.innerHTML =
      '<div style="background: var(--bg-card-muted); border-radius: var(--radius-lg); padding: 24px; text-align: center;">' +
      '<div style="display:inline-block; background: var(--accent-bg); color: var(--accent); font-size: 12.5px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; padding: 6px 14px; border-radius: 999px; margin-bottom: 14px;">' +
      '<i class="ti ti-school" style="vertical-align:-2px; margin-right:4px;"></i>Under Training</div>' +
      '<p style="font-size: 14px; color: var(--text-secondary); margin: 0; line-height: 1.5;">' + (d.attendance_note || 'Not yet eligible for points or incentives.') + '</p>' +
      (hasBeh ? '<p style="font-size: 13px; color: var(--text-secondary); margin: 14px 0 0; padding-top:14px; border-top:1px solid var(--border);">Behaviour score so far: <strong style="color:var(--text-primary);">' + d.behaviour_pct + '%</strong> <span style="opacity:0.7;">(informational — no incentive while under training)</span></p>' : '') +
      '</div>';
    return;
  }
  const hasPoints = d.points !== null;
  const hasAttendance = d.days_present !== null || d.attendance_pct !== null;
  const hasBehaviour = d.behaviour_pct !== null && d.behaviour_pct !== undefined;

  let html = '';

  if (d.total_incentive !== null && d.total_incentive !== undefined) {
    const pts = d.points !== null && d.points !== undefined ? d.points : 0;
    const ded = d.deduction_amount || 0;
    const otPay = d.ot_pay || 0;
    const grandTotal = Math.round((pts + d.total_incentive + otPay - ded) * 100) / 100;
    const otLabel = otPay > 0 ? ' + OT' : (otPay < 0 ? ' &minus; OT' : '');
    const otNote = otPay > 0
      ? ' + &#8377;' + otPay.toLocaleString() + ' OT'
      : (otPay < 0 ? ' <span class="danger-text">&minus; &#8377;' + Math.abs(otPay).toLocaleString() + ' OT</span>' : '');
    html += '<div class="total-box"><span class="label">Total earned (points + incentive' + otLabel + (ded > 0 ? ' &minus; deduction' : '') + ')</span>' +
      '<span class="amount">' + grandTotal.toLocaleString() + '</span></div>' +
      '<p class="note" style="margin-top:-8px; margin-bottom:16px;"><i class="ti ti-info-circle"></i>' +
      (pts !== 0 ? pts.toLocaleString() + ' points + ' : '') + '&#8377;' + d.total_incentive.toLocaleString() + ' incentive' +
      otNote +
      (ded > 0 ? ' &minus; &#8377;' + ded.toLocaleString() + ' half-day deduction' : '') + '</p>';
  }

  let cards = '';
  if (hasPoints) {
    const rank = rankLabel(data, 'points', name, true);
    cards += '<div class="card"><p class="label">Points earned</p>' +
      '<p class="value">' + d.points.toLocaleString() + '</p>' +
      (rank ? '<p class="sub">Rank ' + rank + '</p>' : '') + '</div>';
  }
  if (d.days_present !== null && d.days_present !== undefined) {
    cards += '<div class="card"><p class="label">Days present</p>' +
      '<p class="value">' + d.days_present + '</p>' +
      '<p class="sub">' + d.days_absent + ' absent &middot; ' + d.days_leave + ' leave</p></div>';
    cards += '<div class="card"><p class="label">Late arrivals</p>' +
      '<p class="value"' + (d.half_days > 0 ? ' style="color:var(--danger)"' : '') + '>' + d.late_days + '</p>' +
      '<p class="sub">' + fmtMin(d.late_minutes) + ' total</p></div>';
    const earlyDep = d.early_departure_minutes || 0;
    const netOt = d.ot_minutes - earlyDep;
    const otPayCard = d.ot_pay || 0;
    if (earlyDep > 0) {
      cards += '<div class="card" style="grid-column: span 2;"><p class="label">Overtime logged</p>' +
        '<div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:2px;">' +
        '<span style="font-size:13px; color:var(--text-secondary);">Overtime earned</span>' +
        '<span style="font-size:14px; font-family:var(--font-mono);">' + fmtMin(d.ot_minutes) + '</span></div>' +
        '<div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;">' +
        '<span style="font-size:13px; color:var(--text-secondary);">Early departure</span>' +
        '<span style="font-size:14px; font-family:var(--font-mono); color:var(--danger);">&minus;' + fmtMin(earlyDep) + '</span></div>' +
        '<div style="display:flex; justify-content:space-between; align-items:baseline; border-top:1px solid var(--border); padding-top:6px;">' +
        '<span style="font-size:13px; font-weight:500;">Net</span>' +
        '<span class="value" style="font-size:18px;' + (netOt < 0 ? ' color:var(--danger);' : '') + '">' + fmtMin(netOt) + '</span></div>' +
        (otPayCard > 0 ? '<p class="sub" style="margin-top:6px;">&#8377;' + otPayCard.toLocaleString() + ' OT encashed</p>' : '') +
        '</div>';
    } else {
      cards += '<div class="card"><p class="label">Overtime logged</p>' +
        '<p class="value">' + fmtMin(d.ot_minutes) + '</p>' +
        '<p class="sub">past 6:30pm</p>' +
        (otPayCard > 0 ? '<p class="sub">&#8377;' + otPayCard.toLocaleString() + ' OT encashed</p>' : '') +
        '</div>';
    }
  }

  if (cards) html += '<div class="grid">' + cards + '</div>';

  let notes = '';
  if (!hasPoints) notes += '<p class="note"><i class="ti ti-info-circle"></i>Points aren\'t tracked for this role.</p>';
  if (d.attendance_note) notes += '<p class="note"><i class="ti ti-info-circle"></i>' + d.attendance_note + '</p>';
  html += notes;

  if (hasAttendance && d.attendance_incentive !== null && d.attendance_incentive !== undefined) {
    const pct = d.attendance_pct;
    const fillPct = Math.max(2, Math.round((d.attendance_incentive / 500) * 100));
    html += '<h3>Attendance target achieved</h3>' +
      '<div class="incentive-box">' +
      '<div class="incentive-row"><span class="incentive-label">Attendance score</span><span class="incentive-pct">' + pct + '%</span></div>' +
      '<div class="track" style="height:20px; margin-bottom:10px;"><div class="fill' + (d.attendance_incentive === 0 ? ' danger' : '') + '" style="width:' + fillPct + '%"></div></div>' +
      '<div class="incentive-row"><span class="incentive-label">Earned</span><span class="incentive-amount' + (d.attendance_incentive === 0 ? ' danger-text' : '') + '">&#8377;' + d.attendance_incentive.toLocaleString() + ' <span class="incentive-of">of &#8377;500</span></span></div>' +
      '</div>';
    if (d.half_days && d.half_days > 0) {
      const dayWord = d.half_days === 1 ? 'half-day' : 'half-days';
      let deductionText = d.half_days + ' ' + dayWord + ' pay deduction applies (' + d.late_days + ' late arrivals this month)';
      if (d.deduction_amount !== null && d.deduction_amount !== undefined) {
        deductionText += ' &mdash; &#8377;' + d.deduction_amount.toLocaleString();
      }
      html += '<p class="note danger-text"><i class="ti ti-alert-triangle"></i>' + deductionText + '</p>';
    }
  }

  if (hasBehaviour && d.behaviour_incentive !== null && d.behaviour_incentive !== undefined) {
    const pct = d.behaviour_pct;
    const fillPct = Math.max(2, Math.round((d.behaviour_incentive / 500) * 100));
    html += '<h3>Behaviour incentive earned</h3>' +
      '<div class="incentive-box">' +
      '<div class="incentive-row"><span class="incentive-label">Behaviour score</span><span class="incentive-pct">' + pct + '%</span></div>' +
      '<div class="track" style="height:20px; margin-bottom:10px;"><div class="fill' + (d.behaviour_incentive === 0 ? ' danger' : '') + '" style="width:' + fillPct + '%"></div></div>' +
      '<div class="incentive-row"><span class="incentive-label">Earned</span><span class="incentive-amount' + (d.behaviour_incentive === 0 ? ' danger-text' : '') + '">&#8377;' + d.behaviour_incentive.toLocaleString() + ' <span class="incentive-of">of &#8377;500</span></span></div>' +
      '</div>';
  }

  if (hasPoints) {
    html += '<h3>Points earned (Zoho Projects)</h3>' +
      '<div class="incentive-box">' +
      '<div class="incentive-row"><span class="incentive-label">Total points</span><span class="incentive-amount">' + d.points.toLocaleString() + '</span></div>' +
      '</div>';
  }

  const breakdown = earningsBreakdown(name);
  if (breakdown.length > 1) {
    html += '<h3>Earnings breakdown by month</h3>' + renderEarningsChart(breakdown);
  }

  const history = getHistory(name);
  if (history.length > 1) {
    const maxTotal = Math.max(...history.map(h => h.total), 1);
    html += '<h3>Monthly comparison</h3>';
    history.forEach(h => {
      const pct = Math.max(2, Math.round((h.total / maxTotal) * 100));
      html += '<div class="month-compare-row"><span class="mlabel">' + (monthLabels[h.month] || h.month) + '</span>' +
        '<div class="track"><div class="fill" style="width:' + pct + '%"></div></div>' +
        '<span class="val" style="font-size:12.5px; font-family:var(--font-mono); width:58px; text-align:right;">&#8377;' + h.total.toLocaleString() + '</span></div>';
    });
  } else if (history.length === 1) {
    html += '<p class="note"><i class="ti ti-info-circle"></i>Monthly comparison will appear once more months are added.</p>';
  }

  container.innerHTML = html;
}

function renderTeam() {
  const data = currentData();
  const container = document.getElementById('team-view');
  const byPoints = [...data].filter(d => d.points !== null).sort((a, b) => b.points - a.points);
  const byLate = [...data].filter(d => d.late_days !== null && d.late_days !== undefined).sort((a, b) => b.late_days - a.late_days);

  function bar(label, value, max, suffix, danger) {
    const pct = Math.max(2, Math.round((value / max) * 100));
    return '<div class="barrow"><span class="name">' + label + '</span>' +
      '<div class="track"><div class="fill' + (danger ? ' danger' : '') + '" style="width:' + pct + '%"></div></div>' +
      '<span class="val">' + suffix + '</span></div>';
  }

  const maxPts = Math.max(...byPoints.map(d => d.points));
  const maxLate = Math.max(...byLate.map(d => d.late_days), 1);

  container.innerHTML =
    '<h3>Points</h3>' +
    byPoints.map(d => bar(d.name, Math.max(d.points, 0), maxPts, d.points.toLocaleString())).join('') +
    '<h3>Late days</h3>' +
    byLate.map(d => bar(d.name, d.late_days, maxLate, d.late_days + ' days', d.half_days > 0)).join('');
}

function showMine() {
  document.getElementById('mine-view').style.display = '';
  document.getElementById('team-view').style.display = 'none';
  document.getElementById('teams-view').style.display = 'none';
  document.getElementById('top-view').style.display = 'none';
  document.getElementById('tab-mine').classList.add('active');
  document.getElementById('tab-team').classList.remove('active');
  document.getElementById('tab-teams').classList.remove('active');
  document.getElementById('tab-top').classList.remove('active');
}
function showTeam() {
  document.getElementById('mine-view').style.display = 'none';
  document.getElementById('team-view').style.display = '';
  document.getElementById('teams-view').style.display = 'none';
  document.getElementById('top-view').style.display = 'none';
  document.getElementById('tab-mine').classList.remove('active');
  document.getElementById('tab-team').classList.add('active');
  document.getElementById('tab-teams').classList.remove('active');
  document.getElementById('tab-top').classList.remove('active');
  renderTeam();
}
function showTeams() {
  document.getElementById('mine-view').style.display = 'none';
  document.getElementById('team-view').style.display = 'none';
  document.getElementById('teams-view').style.display = '';
  document.getElementById('top-view').style.display = 'none';
  document.getElementById('tab-mine').classList.remove('active');
  document.getElementById('tab-team').classList.remove('active');
  document.getElementById('tab-teams').classList.add('active');
  document.getElementById('tab-top').classList.remove('active');
  renderTeams();
}
function showTop() {
  document.getElementById('mine-view').style.display = 'none';
  document.getElementById('team-view').style.display = 'none';
  document.getElementById('teams-view').style.display = 'none';
  document.getElementById('top-view').style.display = '';
  document.getElementById('tab-mine').classList.remove('active');
  document.getElementById('tab-team').classList.remove('active');
  document.getElementById('tab-teams').classList.remove('active');
  document.getElementById('tab-top').classList.add('active');
  renderTop();
}

function grandTotalFor(d) {
  if (!d || d.is_training || d.total_incentive === null || d.total_incentive === undefined) return null;
  const pts = d.points !== null && d.points !== undefined ? d.points : 0;
  const ded = d.deduction_amount || 0;
  const otPay = d.ot_pay || 0;
  return Math.round((pts + d.total_incentive + otPay - ded) * 100) / 100;
}

function renderTop() {
  const container = document.getElementById('top-view');
  let html = '<h3 style="margin-top:0;">Employee of the Month</h3>' +
    '<p class="note" style="margin:0 0 16px;"><i class="ti ti-info-circle"></i>Highest total earned (points + incentive &minus; deduction) each month.</p>';

  monthKeys.forEach(k => {
    const data = monthlyData[k];
    const scored = data.map(d => ({ d, total: grandTotalFor(d) })).filter(x => x.total !== null);
    html += '<div class="incentive-box" style="margin-bottom:14px;">' +
      '<div class="incentive-row"><span class="incentive-label">' + (monthLabels[k] || k) + '</span></div>';
    if (scored.length === 0) {
      html += '<p class="note" style="margin:0;">No eligible data.</p></div>';
      return;
    }
    scored.sort((a, b) => b.total - a.total);
    const winner = scored[0];
    html += '<div class="incentive-row" style="align-items:center;">' +
      '<span style="font-size:17px; font-weight:600;"><i class="ti ti-trophy" style="color:#C9A227; margin-right:6px; vertical-align:-2px;"></i>' + winner.d.name + '</span>' +
      '<span class="incentive-amount">&#8377;' + winner.total.toLocaleString() + '</span></div>';
    if (scored.length > 1) {
      html += '<p class="note" style="margin:8px 0 0;">Runner-up: ' + scored[1].d.name + ' &mdash; &#8377;' + scored[1].total.toLocaleString() + '</p>';
    }
    html += '</div>';
  });

  container.innerHTML = html;
}

function renderTeams() {
  const data = currentData();
  const container = document.getElementById('teams-view');
  let html = '';

  teams.forEach(team => {
    const memberData = team.members.map(name => data.find(d => d.name === name)).filter(Boolean);
    const scored = memberData.filter(d => !d.is_training && d.points !== null && d.points !== undefined);
    const avg = scored.length > 0 ? Math.round((scored.reduce((s, d) => s + d.points, 0) / scored.length) * 100) / 100 : null;

    html += '<div style="margin-bottom: 28px;">';
    html += '<h3 style="margin-top:0;">' + team.name + '</h3>';

    // Leader row, with average shown alongside
    html += '<div style="background: var(--accent-bg); border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 10px; display:flex; justify-content:space-between; align-items:center;">' +
      '<div><p style="margin:0; font-weight:600; font-size:14.5px; color:var(--accent);">' + team.leader + '</p>' +
      '<p style="margin:2px 0 0; font-size:12px; color:var(--text-secondary);">Team Lead</p></div>' +
      '<div style="text-align:right;"><p style="margin:0; font-size:12px; color:var(--text-secondary);">Team avg (points)</p>' +
      '<p style="margin:0; font-size:18px; font-weight:600; font-family:var(--font-mono); color:var(--accent);">' + (avg !== null ? avg.toLocaleString() : '\u2013') + '</p></div>' +
      '</div>';

    // Members, vertically stacked
    html += '<div style="display:flex; flex-direction:column; gap:6px;">';
    team.members.forEach(name => {
      const d = data.find(x => x.name === name);
      let rightSide = '\u2013';
      if (d) {
        if (d.is_training) rightSide = '<span style="font-size:11.5px; background:var(--bg-card-muted); color:var(--text-secondary); padding:3px 8px; border-radius:999px;">Training</span>';
        else if (d.points !== null && d.points !== undefined) rightSide = '<span style="font-family:var(--font-mono); font-size:13.5px;">' + d.points.toLocaleString() + '</span>';
      }
      html += '<div style="display:flex; justify-content:space-between; align-items:center; background:var(--bg-card-muted); border-radius:var(--radius-md); padding:10px 14px;">' +
        '<span style="font-size:13.5px;">' + name + '</span>' + rightSide + '</div>';
    });
    html += '</div></div>';
  });

  container.innerHTML = html;
}

function refreshAll() {
  populatePeople();
  renderMine(sel.value);
}

monthSel.addEventListener('change', refreshAll);
sel.addEventListener('change', () => renderMine(sel.value));
document.getElementById('tab-mine').addEventListener('click', showMine);
document.getElementById('tab-team').addEventListener('click', showTeam);
document.getElementById('tab-teams').addEventListener('click', showTeams);
document.getElementById('tab-top').addEventListener('click', showTop);

populatePeople();
renderMine(sel.value);
</script>
</body>
</html>
